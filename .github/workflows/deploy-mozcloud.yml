name: Deploy to MozCloud environment
on:
  push:
    branches: [ '**' ]
    tags: ['*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: stage
        type: choice
        options:
          - dev
          - stage
          - prod
jobs:
  build-and-deploy-dev:
    uses: ./.github/workflows/build-and-push-to-gar.yml
    # MozCloud deployment is upstream-only. Forks should not attempt to use
    # Mozilla workload identity or GAR project configuration.
    if: >
      github.repository == 'mozilla/fx-private-relay' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    with:
      image_tag_metadata: ${{ inputs.environment || 'dev' }}